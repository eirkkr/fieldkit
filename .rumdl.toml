# Table Format
[MD060]
enabled = true
style = "aligned"

[global]
# Generated: `just openspec-refresh` overwrites repo-skills/ from the openspec
# CLI, then appends the kit's repo-skills-overlay/*.md (ADR 034). Neither half
# is hand-edited here, so it isn't linted - but repo-skills-overlay/ is the
# kit's own prose and is.
exclude = ["repo-skills/openspec-*/"]

# Fragments, not documents: schema templates are filled into an artifact and
# overlays are appended to a SKILL.md, so neither owns the file's H1. The
# proposal/spec templates are also upstream copies kept verbatim (ADR 034),
# so their list spacing isn't ours to reflow.
#
# Keep the leading `**/`. These globs are matched against the path as it was
# passed in, and an editor's language server passes an absolute one - which a
# repo-relative glob silently fails to match, so the ignore applies on the
# command line but not in the IDE. It also covers a consumer repo opening
# these files through its openspec/schemas symlinks.
[per-file-ignores]
"**/schemas/*/templates/*.md" = ["MD041", "MD032"]
"**/repo-skills-overlay/*.md" = ["MD041"]
