name: review-gated
version: 1
description: >-
  Spec-driven workflow with bite-sized tasks, a human review gate at the end
  of every stage, and a final whole-change review
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from openspec/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example:
      ```
      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.

      Each requirement here is something the final review (the last stage of
      tasks.md) will check the built code against, one by one. Write them so
      that check is possible: a requirement no one can hold the diff up
      against is not finished.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Background, current state, constraints, stakeholders
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal for motivation and specs for requirements.

      Good design docs explain the "why" behind technical decisions.

      Record any assumption the build rests on but has not yet proved - the
      stage that first depends on it opens by testing it, and finding it false
      is a legitimate reason for that stage's review gate to send the plan
      back rather than the code.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Bite-sized implementation tasks, grouped into review-gated stages
    template: tasks.md
    instruction: |
      Create the task list that breaks the implementation into bite-sized
      tasks, grouped into stages, with a human review gate ending every stage.

      **IMPORTANT: Follow the template exactly.** The apply phase parses
      `- [ ]` checkboxes to track progress. Anything not written as `- [ ]`
      is invisible to it.

      The whole point of the format is that a human reviews this work in
      small, coherent instalments instead of one large diff at the end.
      Optimise every decision below for the reviewer, not for the writer.

      ## Bite-sized tasks

      One task is ONE action with ONE done-condition. Concretely:

      - Name the file(s) it touches. A task that cannot name them is too big.
      - Give it an explicit done-condition, written as `Done when ...`. It
        must be checkable by running something or looking at something
        specific - not "done when it works".
      - Where an existing file shows the pattern, say "copy/adapt <path>".
      - Keep the description under about 5 lines. If it needs more, the task
        is doing too much.
      - Split on "and". A task that adds a dependency AND configures it AND
        proves it loads is three tasks. The exception is a genuinely atomic
        pair - a rename and its call sites - which is one task because the
        tree is broken between them.
      - Size for the least-skilled likely implementer.

      ## Stages

      A stage is the smallest group of tasks that leaves the tree in a
      coherent, reviewable state. It is also what gets merged: one stage is
      one branch and one PR. Three hard rules:

      - **A stage must end green.** Tests pass, nothing is half-wired, the
        work is committable. A reviewer must never be asked to sign off on a
        broken tree.
      - **A stage must be one idea.** The reviewer should be able to say what
        the stage did in a sentence.
      - **A stage must be independently mergeable.** It lands on the default
        branch on approval, ahead of the stages after it, so anything not
        finished by the end of the stage is either complete from the user's
        point of view or unreachable. Never merely present and untested.
        Three ways to reach that, cheapest first: leave it **not wired up**
        (built and tested, but no route registered, no command added to its
        group, no caller yet); put it **behind a flag** that a later stage
        switches on and a later task removes; or build it **beside the old
        path** and swap in one stage rather than half-migrating in each.
        Prefer the first, and order stages so it falls out - a stage that
        needs a flag is often a boundary drawn in the wrong place. When
        green alone would allow the boundary to fall in two places, this
        rule chooses between them.

      Aim for 3-6 tasks per stage; 8 is the ceiling. If a stage exceeds it,
      split it - stage count is cheap, and a smaller stage is a cheaper
      review. Prefer more, smaller stages over fewer, larger ones whenever
      the choice is open.

      Order stages so the risky, assumption-testing work comes early, while
      changing course is still cheap. Walking-skeleton first: get the thing
      running end to end on stubs before deepening any one part. Build order
      is not feature order.

      Open each stage with 1-3 sentences directly under the heading: what it
      delivers, and what must be true before the next stage starts.

      ## Review gates

      Every stage's LAST task is its review gate. Write it exactly like this,
      as an ordinary numbered checkbox so progress tracking counts it:

      ```
      - [ ] 2.6 REVIEW GATE - stage 2. Stop here. Do not tick this box, and
            do not begin stage 3, until the reviewer approves. Write the
            review note below first.
      ```

      Leave the note itself blank when authoring tasks.md - it is written
      during the apply phase, when there is something to report.

      ## Final review

      The last stage of EVERY change is the final review, and it is the only
      stage whose tasks are not implementation work. Give it its own numbered
      stage at the end:

      ```
      ## 7. Stage 7 - final review

      The whole change, checked against its own spec, together with the
      reviewer. Iterate until they are satisfied.

      - [ ] 7.1 Re-read proposal.md, design.md and every delta spec against
            what was actually built. List each requirement and where it is
            satisfied in the code. Flag any that is unmet, partly met, or met
            differently than specified.
      - [ ] 7.2 List everything built that no requirement asked for, and
            everything the artifacts still describe that was not built.
            Either the code or the artifacts is wrong - say which.
      - [ ] 7.3 Update the artifacts so they describe what was actually
            built, including decisions that changed mid-flight. Record
            anything durable as an ADR rather than leaving it in design.md.
      - [ ] 7.4 Walk the full diff for the conventions CI cannot check.
      - [ ] 7.5 FINAL REVIEW - present the change as a whole and iterate with
            the reviewer until they are satisfied. Stop here. Only the
            reviewer closes this box.
      - [ ] 7.6 Archive the change once the final stage has merged. Done
            when the change folder is under `archive/` and its delta is
            synced into the living specs, in a PR of its own.
      ```

      Adapt the wording, but keep all six beats: verify against spec, find
      the gaps in both directions, reconcile the artifacts, hand-audit the
      diff, iterate with the human, then archive.

      Reference specs for what to build and design for how. Every task must
      be verifiable - you know when it is done, and so does the reviewer.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Work through the pending tasks in order, one at a time.

    THREE LEVELS OF REVIEW GOVERN THIS PHASE. They are not advisory.

    ## L1 - after every task (you, no human)

    Before ticking any box, check the work against that task's own
    `Done when ...` condition and run the narrowest test that covers it.

    - Tick `- [ ]` to `- [x]` only when the done-condition is literally met.
    - Commit the task on its own, with the task number in the subject
      (`feat: add is_dev_db (1.1)`). One commit per task is what lets the
      reviewer walk the stage step by step at the gate; batching several
      tasks into one commit takes that away.
    - If you cannot verify it, do NOT tick the box. Stop and say why.
    - If the task turned out to need work the plan did not anticipate, note
      it under the task in one line. That note feeds the stage's review.
    - Keep the change scoped to the task. Work you notice but were not asked
      for goes in the review note as a suggestion, not into the diff.

    ## L2 - at every REVIEW GATE (hard stop)

    A task whose text says REVIEW GATE is a full stop.

    - NEVER tick a review gate yourself. Only the human closes it.
    - NEVER start the next stage's tasks. Ending the stage IS the deliverable.
    - Before stopping, confirm the stage really is green - run the repo's
      test command. A gate reached on a red tree is not reached; fix or
      report it first.
    - Write the review note into tasks.md, indented under the gate's
      checkbox, then show the same note in your reply. Written first, so it
      survives the session.

    The note is the reviewer's whole picture of this stage. Cover, in this
    order, and keep it tight - complete, not long:

    1. **Review this stage** - the diff itself, written out both ways so the
       reviewer clicks or copies rather than assembles, then the stage's
       commits so it can be walked task by task:

           **Review this stage**

               https://github.com/<owner>/<repo>/pull/<n>/files

               git diff <default-branch>...HEAD

           Task by task:

           - 1.1 add is_dev_db - https://github.com/<owner>/<repo>/commit/9c1d0a4e
           - 1.2 cover is_dev_db - https://github.com/<owner>/<repo>/commit/3b77e215

       The PR view leads: it alone holds state - files tick off as they are
       read, a file a later fix touches again un-ticks itself, comments
       outlive the session. The PR holds exactly this stage, so it needs no
       range and no base commit - `/pull/<n>/files` IS the stage. Do not
       reconstruct the old `<base>..HEAD` form; there is nothing before this
       stage on this branch.

       The per-task lines are a walking aid, not a second review surface. A
       commit URL renders that commit against its parent, which is exactly
       "this task, on top of the last one". They work on any pushed commit,
       so they cost nothing beyond committing per task.

       At a FIRST gate, add one more line, because nothing else will remember
       it once the stages have merged separately and the final review needs
       it:

           Change based at `1f4b02e7`.

       That is `git merge-base <default-branch> HEAD` at the start of the
       change. Carry the same line forward, unchanged, in every later note.
    2. **What changed** - per file or behaviour, since the previous gate.
       Enough that they know where to look without reading the diff first.
    3. **Departures from the plan** - anything built differently than
       design.md or tasks.md said, and why. Say "none" if none.
    4. **How to verify** - the exact commands to run and what a good result
       looks like, plus any manual step (what to click, what to expect).
    5. **Look closely at** - the judgement calls and the risky part. Point
       them at what you are least sure of. This is the most valuable line in
       the note; never leave it out to look confident.
    6. **Not done yet** - known gaps that later stages cover, so the
       reviewer does not report them as defects.
    7. **Reviewed at** - the heading, with `_Awaiting approval._` under it and
       what ticking it will record. Visible text, not an HTML comment: it
       stands for the length of the review, and a comment renders as dead
       space that reads as something having failed.

    EVERY gate opens a PR for the stage's branch. It is the surface the note
    points at, so opening it is part of reaching the gate, and it needs no
    approval of its own. Not a draft: the stage is done and is being asked
    for, which is what a non-draft PR means. Opening it here is also what
    starts CI, so the first run lands on a tree already green rather than on
    half-finished work.

    Then stop and wait. If the reviewer sends the stage back, fix it in this
    stage's own branch and PR and rewrite the note; do not open a new stage,
    and do not merge, to carry the fix.

    When the reviewer approves, and only then, close the gate: replace
    `_Awaiting approval._` under **Reviewed at** with
    `git rev-parse --short HEAD`, tick the box, and merge the PR. That commit
    is the tree they approved - after any fixes the review asked for, not the
    commit the note was first written against - and it is recorded because
    the squash-merge is about to discard the branch that holds it. Never
    write a SHA into a gate the reviewer has not approved: a bookmark that is
    not where they stopped reading is worse than none.

    Then start the next stage on a fresh branch cut from the default branch,
    which now has this stage in it. Never continue on the merged branch, and
    never branch the next stage off this one before it merges.

    ## L3 - the final stage

    The last stage is the whole-change review. Its closing task is a stop of
    the same kind: present the change as a whole, take the reviewer's
    feedback, revise, and present again. Iterate until they say they are
    satisfied. Do not archive, and do not treat the change as complete,
    until they do.

    It differs from an L2 gate in four ways:

    1. **Its note opens with two diffs, not one.** This stage's own diff
       leads, exactly as any stage's does - its PR, its per-task lines. The
       whole change follows, based at the `Change based at` commit the first
       gate recorded. Most of the change has already merged, so that half is
       git against the default branch rather than a PR view:

           **Review this stage**

               https://github.com/<owner>/<repo>/pull/<n>/files

               git diff <default-branch>...HEAD

           **Review the whole change**, based at `1f4b02e7`:

               git log --oneline 1f4b02e7..<default-branch>

               git diff 1f4b02e7...<default-branch>

       Name the base commit, and list the merged stages by their PR numbers
       beside the log command. The reviewer has seen each stage already; what
       they have not seen is the shape of all of them together, which is what
       this gate is for.
    2. **The diff walk comes before the artifacts are corrected.** Walking
       the diff for the conventions CI cannot check turns up
       artifact-shaped findings, so correcting first means correcting
       twice. The walk changes nothing on its own.
    3. **The reconciliation runs in three directions, not two.** Unmet
       requirements; things built that no requirement asked for; and
       requirements met only by construction, with no test behind them.
       Name each of the third kind and say what would verify it.
    4. **Every issue the change references is re-read.** In the artifacts,
       in docstrings, in the docs the change touches: still open, and still
       about the thing cited. Nothing else re-reads those references after
       they are written.

    Once the reviewer is satisfied, close this gate and merge it like any
    other stage. Archiving is not part of it: that is its own PR, cut from
    the default branch after the final stage has landed, moving the change
    folder under `archive/` and syncing its delta into the living specs.
    Until it merges the living specs still describe the pre-change behaviour,
    which is expected - the change folder is the record while a change is in
    flight.

    ## Otherwise

    Pause and ask if a task is ambiguous, if implementation reveals a design
    problem, or if you hit a blocker. Do not guess.
