# Fail a PR whose branch name breaks conventions/git.md's branch rules.
#
# Reusable, for consumer repos: each calls it from its own pull_request
# workflow, which .fieldkit/scripts/enable-branch-check.sh writes. It checks
# out the kit and runs `just check-branch-name` there, the same recipe the
# kit's own `just check` runs, so the rules come from the kit's git.md at
# kit-ref and a rule change reaches every caller unedited.
name: Branch name

on:
  workflow_call:
    inputs:
      kit-repository:
        description: The kit repo to read the rules from
        type: string
        default: eirkkr/fieldkit
      kit-ref:
        description: The kit ref to read the rules from
        type: string
        default: main

jobs:
  branch-name:
    # A bot's branch names come from its own config, which the naming rule
    # can't instruct - so its PRs aren't held to it.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kit-repository }}
          ref: ${{ inputs.kit-ref }}

      - name: Install just
        run: curl -sSfL https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - run: just check-branch-name
