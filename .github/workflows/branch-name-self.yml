# Check the kit's own PR branch names through the reusable branch-name
# workflow, against the PR's copy of the kit - the one place the kit checks
# them, so the path consumers call is exercised before it reaches them.
name: Branch name (self-test)

on: pull_request

jobs:
  branch-name:
    uses: ./.github/workflows/branch-name.yml
    with:
      kit-repository: ${{ github.repository }}
      kit-ref: ${{ github.event.pull_request.head.sha }}
