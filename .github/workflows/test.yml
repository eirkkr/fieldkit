# Run the kit's test recipe (the creation script, the worktree-edit hook, the
# install guard and the hook registration) on demand only: a PR does not start
# it. Run it from the Actions tab, or `gh workflow run test.yml --ref <branch>`.
# `just check` runs the same recipe locally before a PR opens.
name: Test

on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6

      # A pinned tool through uv, like rumdl in the justfile (ADR 004).
      - name: Install just
        run: uv tool install rust-just@1.58.0

      - run: just test
