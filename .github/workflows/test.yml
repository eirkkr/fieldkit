# Run the kit's test recipe (the creation script, the worktree-edit hook, the
# install guard and the hook registration) when started, not on each push.
# A push is attempt 1 and skips the job; a re-run, which `just ci` starts, is
# attempt 2 and runs it. A PR shows the job as skipped until then. `just check`
# runs the same recipe locally before a PR opens.
name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A newer push supersedes a run still going on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # A push is attempt 1 and skips; a re-run is attempt 2 and runs.
    if: github.run_attempt > 1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6

      # A pinned tool through uv, like rumdl in the justfile (ADR 004).
      - name: Install just
        run: uv tool install rust-just@1.58.0

      - run: just test
